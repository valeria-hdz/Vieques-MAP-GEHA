    const a=b.dataset.key===k;
    b.style.background=a?'#378ADD':'transparent';
    b.style.color=a?'#fff':'var(--color-text-primary)';
    b.style.borderColor=a?'#378ADD':'#ccc';
  });
  render();
}

function setDS(ds){
  curDS=ds;
  ['total','bio'].forEach(d=>{
    const b=document.getElementById('b-'+d), on=d===ds;
    b.style.background=on?'#1D9E75':'transparent';
    b.style.color=on?'#fff':'var(--color-text-primary)';
    b.style.borderColor=on?'#1D9E75':'#ccc';
  });
  buildBtns(ds); render();
}

function render(){
  const g=document.getElementById('circles');
  g.innerHTML='';
  const mx=gmax(curM), mk=MK[curDS], un=UN[curDS];
  S.forEach(s=>{
    const [cx,cy]=proj(s.lat,s.lng);
    const val=s[curM], mort=s[mk], r=cr(val,mx);
    const grp=document.createElementNS(ns,'g');
    grp.style.cursor='pointer';
    const c=document.createElementNS(ns,'circle');
    c.setAttribute('cx',cx); c.setAttribute('cy',cy); c.setAttribute('r',r);
    c.setAttribute('fill',ZC[s.z]); c.setAttribute('fill-opacity',val!=null?'0.85':'0.15');
    c.setAttribute('stroke',rc(mort)); c.setAttribute('stroke-width','2');
    const lbl=document.createElementNS(ns,'text');
    lbl.setAttribute('x',cx); lbl.setAttribute('y',cy-r-2);
    lbl.setAttribute('text-anchor','middle'); lbl.setAttribute('font-size','6.5');
    lbl.setAttribute('fill','#111'); lbl.setAttribute('pointer-events','none');
    lbl.textContent=s.id;
    grp.addEventListener('mouseenter',()=>{
      const tg=document.getElementById('ttg');
      const bx=cx>400?cx-178:cx+10, by=cy>180?cy-75:cy+8;
      document.getElementById('ttbg').setAttribute('x',bx-4); document.getElementById('ttbg').setAttribute('y',by-14);
      document.getElementById('ttbg').setAttribute('width','175'); document.getElementById('ttbg').setAttribute('height','64');
      const mk2=curM.replace('_t','').replace('_b','');
      document.getElementById('ttl1').setAttribute('x',bx+4); document.getElementById('ttl1').setAttribute('y',by); document.getElementById('ttl1').textContent=`${s.id} · ${s.loc}`;
      document.getElementById('ttl2').setAttribute('x',bx+4); document.getElementById('ttl2').setAttribute('y',by+14); document.getElementById('ttl2').textContent=`${mk2}: ${val!=null?val+' '+un:'—'}`;
      document.getElementById('ttl3').setAttribute('x',bx+4); document.getElementById('ttl3').setAttribute('y',by+28); document.getElementById('ttl3').textContent=`${mk==='m96'?'96h':'24h'} mortality: ${mort!=null?mort+'%':'—'}`;
      document.getElementById('ttl4').setAttribute('x',bx+4); document.getElementById('ttl4').setAttribute('y',by+43); document.getElementById('ttl4').textContent=`Org: ${s.org!=null?s.org+'%':'—'} · Zone ${s.z}`;
      tg.style.display='';
    });
    grp.addEventListener('mouseleave',()=>{ document.getElementById('ttg').style.display='none'; });
    grp.appendChild(c); grp.appendChild(lbl); g.appendChild(grp);
  });
  document.getElementById('ttg').style.display='none';
}

buildBtns('total'); render();
</script>
